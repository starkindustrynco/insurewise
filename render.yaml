# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint in the Render dashboard, pick this repository, then set
# GOOGLE_GENERATIVE_AI_API_KEY when prompted.
services:
  - type: web
    name: insurewise
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash
